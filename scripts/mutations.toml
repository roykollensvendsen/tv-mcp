# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/tv_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a commit message never links to a Claude session"
file = "scripts/no_session_links.py"
find = 'if SESSION\.search\(message\):'
replace = 'if False:'

[[rule]]
name = "a home-network address is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"home-network address \{m\}" for m in PRIVATE_IPV4\.findall\(text\)\]'
replace = 'pass'

[[rule]]
name = "a value from the settings file is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"a value from \{SETTINGS\.name\}" for s in secrets if s in text\]'
replace = 'pass'

[[rule]]
name = "a name that matches two TVs is refused"
file = "src/tv_mcp/settings.py"
find = 'if len\(matches\) > 1:'
replace = 'if False:'

[[rule]]
name = "a hands-off TV is never contacted"
file = "src/tv_mcp/service.py"
find = 'if tv\.hands_off or tv\.address is None:'
replace = 'if tv.address is None:'

[[rule]]
name = "only a switched-on feature adds tools"
file = "src/tv_mcp/server.py"
find = 'for feature in wanted:'
replace = 'for feature in FEATURES:'

[[rule]]
name = "a title that matches several items is refused, naming them"
file = "src/tv_mcp/service.py"
find = 'return _refused\(f"\{title!r\} could be: \{options\}\. Which one\?"\)'
replace = 'return found[0].id'

[[rule]]
name = "a hands-off TV is never played on or controlled"
file = "src/tv_mcp/service.py"
find = '        if tv\.hands_off:'
replace = 'if False:'

[[rule]]
name = "a hands-off TV is never switched"
file = "src/tv_mcp/power.py"
find = '        if tv\.hands_off:'
replace = 'if False:'

[[rule]]
name = "a switch is refused when the TV state is not known"
file = "src/tv_mcp/power.py"
find = '        if now is None:'
replace = 'if False:'

[[rule]]
name = "a request the TV already satisfies is refused"
file = "src/tv_mcp/power.py"
find = '        if now == state:'
replace = 'if False:'

[[rule]]
name = "a power token works once"
file = "src/tv_mcp/power.py"
find = '        self\._pending = None'
replace = 'pass'

[[rule]]
name = "a power token expires after thirty seconds"
file = "src/tv_mcp/power.py"
find = '        if self\._clock\(\) - pending\.asked_at > EXPIRES:'
replace = 'if False:'

[[rule]]
name = "a switch is refused when the TV changed since the question"
file = "src/tv_mcp/power.py"
find = '        if await self\._state\(pending\.tv\) == wanted:'
replace = 'if False:'

[[rule]]
name = "a hands-off TV never has an app opened or closed"
file = "src/tv_mcp/service.py"
find = '        if tv\.hands_off or not tv\.address:'
replace = 'if False:'

[[rule]]
name = "a TV that answers as another device is not acted on"
file = "src/tv_mcp/service.py"
find = '        if info is not None and tv\.device_id and info\.device_id != tv\.device_id:'
replace = 'if False:'

[[rule]]
name = "every tool answers with a sentence, even when it fails"
file = "src/tv_mcp/server.py"
find = '        FEATURES\[feature\]\(guarded, service, simulated\)  # type: ignore\[arg-type\]'
replace = 'FEATURES[feature](server, service, simulated)'

[[rule]]
name = "a tool still working at the deadline says it carries on"
file = "src/tv_mcp/server.py"
find = '                    answer = await asyncio\.wait_for\(asyncio\.shield\(work\), ANSWER_WITHIN\)'
replace = 'answer = await asyncio.wait_for(work, ANSWER_WITHIN)'

[[rule]]
name = "a measure that gets worse fails the check"
file = "scripts/ratchet.py"
find = 'if _worse\(metric, base\[metric\], now\[metric\]\) and metric not in allowed:'
replace = 'if False:'

[[rule]]
name = "when the levels main kept are missing, the base is measured"
file = "scripts/ratchet.py"
find = '^    return measure_base\(\)$'
replace = 'return {}'

[[rule]]
name = "an input is changed only while the screen is on"
file = "src/tv_mcp/service.py"
find = '        if info is not None and info\.power == "on":'
replace = 'if True:'

[[rule]]
name = "a TV that does not answer is not asked what it plays or how loud it is"
file = "src/tv_mcp/service.py"
find = '            if not tv\.hands_off and report\["state"\] != UNREACHABLE:'
replace = 'if not tv.hands_off:'

[[rule]]
name = "a confirmed switch answers once, within the voice time"
file = "src/tv_mcp/power.py"
find = '        until = started \+ CONFIRM_WITHIN'
replace = 'until = started + 60 * CONFIRM_WITHIN'

[[rule]]
name = "a wait for a TV ends within the voice time"
file = "src/tv_mcp/service.py"
find = '        until = self\._clock\(\) \+ WAIT_WITHIN'
replace = 'until = self._clock() + 60 * WAIT_WITHIN'

[[rule]]
name = "art mode is only read, never set"
file = "src/tv_mcp/drivers/samsung_tizen.py"
find = '                mode = channel\.get_artmode\(\)'
replace = 'mode = channel.set_artmode("on") or channel.get_artmode()'

[[rule]]
name = "an app is said open only once it is in front"
file = "src/tv_mcp/service.py"
find = 'if not isinstance\(driver, SeesApps\):'
replace = 'if True:'

[[rule]]
name = "a device name that fits two inputs is refused"
file = "src/tv_mcp/service.py"
find = 'if len\(fits\) == 1:'
replace = 'if fits:'

[[rule]]
name = "a name set by hand wins over a detected one"
file = "src/tv_mcp/service.py"
find = 'entries = found \| by_hand'
replace = 'entries = by_hand | found'
